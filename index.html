<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🍄 波比冒險島</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d1a;font-family:'Trebuchet MS','Segoe UI',sans-serif;position:fixed;touch-action:none;}
#game{position:absolute;top:0;left:0;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;}

#controls{position:absolute;bottom:0;left:0;width:100%;height:0;z-index:20;pointer-events:none;}
.btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  font-weight:900;color:#fff;border:none;touch-action:none;transition:transform .05s,filter .05s;}
.btn:active,.btn.pressed{transform:scale(0.94);filter:brightness(1.35);}
.dpad{bottom:max(24px,env(safe-area-inset-bottom));width:96px;height:104px;font-size:2.8rem;
  background:linear-gradient(145deg,#3a4a6b,#28344d);box-shadow:0 5px 0 #1a2233,0 8px 14px rgba(0,0,0,.4);
  border:3px solid rgba(255,255,255,.18);}
#btnLeft{left:18px;border-radius:22px 8px 8px 22px;}
#btnRight{left:116px;border-radius:8px 22px 22px 8px;}
#btnJump{right:20px;bottom:max(24px,env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;font-size:1.5rem;
  background:radial-gradient(circle at 35% 30%,#ff8a5c,#e8472e);box-shadow:0 5px 0 #a5301d,0 8px 16px rgba(0,0,0,.45);
  border:3px solid rgba(255,255,255,.25);}
#btnRun{right:136px;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 44px);width:72px;height:72px;border-radius:50%;font-size:.95rem;
  background:radial-gradient(circle at 35% 30%,#ffd166,#f0a500);box-shadow:0 4px 0 #b87900,0 7px 13px rgba(0,0,0,.4);
  border:3px solid rgba(255,255,255,.25);color:#5a3a00;}

#hud{position:absolute;top:0;left:0;width:100%;padding:max(10px,env(safe-area-inset-top)) 14px 0;z-index:15;display:flex;
  justify-content:space-between;align-items:flex-start;pointer-events:none;
  font-weight:900;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.5);}
.hud-box{background:rgba(20,20,40,.55);border-radius:14px;padding:6px 12px;
  border:2px solid rgba(255,255,255,.15);display:flex;gap:14px;font-size:1rem;align-items:center;}
.hud-item{display:flex;align-items:center;gap:4px;}

.overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 30%,rgba(40,30,70,.92),rgba(12,10,28,.97));overflow-y:auto;}
.overlay.hidden{display:none;}
.title-logo{font-size:clamp(2.4rem,12vw,4.2rem);font-weight:900;line-height:1;
  background:linear-gradient(180deg,#ffe66d,#ff9f1c,#ff6b35);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(3px 4px 0 #c1440e);letter-spacing:1px;
  animation:bob 2.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-12px) rotate(1deg);}}
.title-sub{color:#bcd;font-size:1.05rem;margin-top:6px;font-weight:700;letter-spacing:2px;}
.hero-emoji{font-size:5rem;margin:10px 0;animation:heroHop 1.4s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));}
@keyframes heroHop{0%,100%{transform:translateY(0) scale(1);}40%{transform:translateY(-26px) scale(1.08,.92);}70%{transform:translateY(0) scale(.95,1.05);}}
.big-btn{margin-top:18px;padding:16px 44px;font-size:1.4rem;font-weight:900;color:#fff;border:none;cursor:pointer;
  border-radius:50px;background:linear-gradient(145deg,#43d17a,#1ea65a);
  box-shadow:0 6px 0 #137a3f,0 10px 22px rgba(0,0,0,.4);letter-spacing:2px;
  border:3px solid rgba(255,255,255,.3);transition:transform .08s;}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #137a3f;}
.menu-card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);border-radius:22px;
  padding:20px 24px;max-width:380px;width:100%;}
.help-row{color:#cde;font-size:.92rem;line-height:1.85;text-align:left;margin-top:8px;}
.help-row b{color:#ffd166;}
.lvl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;width:100%;max-width:380px;}
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;width:100%;max-width:380px;}
.char-btn{aspect-ratio:1;border-radius:20px;border:3px solid rgba(255,255,255,.18);cursor:pointer;
  background:linear-gradient(145deg,#4a5d8a,#2d3a59);color:#fff;font-size:2.6rem;
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #1a2440;
  transition:transform .12s,box-shadow .12s;position:relative;}
.char-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a2440;}
.char-btn.selected{border-color:#ffd166;background:linear-gradient(145deg,#5a7dca,#3a5099);
  box-shadow:0 0 0 3px #ffd166,0 6px 0 #1a2440,0 0 22px rgba(255,209,102,.6);transform:translateY(-3px) scale(1.05);}
.char-btn .char-check{position:absolute;top:-8px;right:-8px;font-size:1.1rem;display:none;}
.char-btn.selected .char-check{display:block;}
.char-info{margin-top:14px;color:#ffe9b8;font-weight:800;font-size:1.05rem;min-height:1.4em;letter-spacing:1px;}
.char-info .cname{color:#ffd166;font-size:1.2rem;}
.lvl-btn{aspect-ratio:1;border-radius:18px;border:3px solid rgba(255,255,255,.2);cursor:pointer;
  background:linear-gradient(145deg,#4a5d8a,#2d3a59);color:#fff;font-weight:900;font-size:1.5rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 5px 0 #1a2440;transition:transform .08s;position:relative;}
.lvl-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a2440;}
.lvl-btn.locked{filter:grayscale(.8) brightness(.55);cursor:not-allowed;}
.lvl-btn .lvl-name{font-size:.6rem;font-weight:700;letter-spacing:.3px;opacity:.85;padding:0 2px;}
.lvl-btn .lvl-star{position:absolute;top:4px;right:6px;font-size:.7rem;letter-spacing:-2px;}
.result-title{font-size:clamp(2rem,9vw,3rem);font-weight:900;}
.result-title.win{color:#ffe66d;text-shadow:3px 3px 0 #c1440e;}
.result-title.lose{color:#ff6b8a;text-shadow:3px 3px 0 #6b1530;}
.result-stats{color:#cde;font-size:1.1rem;margin:14px 0;line-height:1.8;font-weight:700;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.small-btn{padding:12px 24px;font-size:1.02rem;font-weight:900;color:#fff;border:none;cursor:pointer;
  border-radius:40px;background:linear-gradient(145deg,#5a6dae,#3a4a82);box-shadow:0 5px 0 #232f55;
  border:2px solid rgba(255,255,255,.2);letter-spacing:1px;transition:transform .08s;}
.small-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #232f55;}
.small-btn.green{background:linear-gradient(145deg,#43d17a,#1ea65a);box-shadow:0 5px 0 #137a3f;}
.small-btn.gold{background:linear-gradient(145deg,#ffd166,#f0a500);box-shadow:0 5px 0 #b87900;color:#5a3a00;}
#flashMsg{position:absolute;top:30%;left:50%;transform:translateX(-50%);z-index:18;
  font-size:clamp(1.6rem,8vw,2.6rem);font-weight:900;color:#ffe66d;text-shadow:3px 3px 0 #c1440e;
  pointer-events:none;opacity:0;letter-spacing:2px;text-align:center;width:90%;}
#flashMsg.show{animation:flashIn 1.6s ease;}
@keyframes flashIn{0%{opacity:0;transform:translateX(-50%) scale(.4);}18%{opacity:1;transform:translateX(-50%) scale(1.12);}
  32%{transform:translateX(-50%) scale(1);}78%{opacity:1;}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-30px);}}
#pauseBtn{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:16;pointer-events:auto;
  background:rgba(20,20,40,.55);border:2px solid rgba(255,255,255,.15);border-radius:12px;
  color:#fff;font-size:1.1rem;padding:5px 14px;font-weight:900;cursor:pointer;}
.credit{margin-top:18px;color:rgba(255,255,255,.35);font-size:.78rem;}
#errBox{position:absolute;top:0;left:0;right:0;background:#c0392b;color:#fff;font-size:12px;
  padding:8px;z-index:9999;font-family:monospace;white-space:pre-wrap;display:none;}
.hidden{display:none!important;}
</style>
</head>

</div>
<button id="pauseBtn" class="hidden">⏸</button>

<div id="controls" class="hidden">

  <button class="btn dpad" id="btnRight">▶</button>
  <button class="btn" id="btnRun">衝刺</button>
  <button class="btn" id="btnJump">跳 ⬆</button>
</div>

<div id="flashMsg"></div>

<div class="overlay" id="menuScreen">
  <div class="hero-emoji">🐹</div>
  <div class="title-logo">波比冒險島</div>
  <div class="title-sub">POBBY · ADVENTURE</div>
  <div class="menu-card">
    <button class="big-btn" id="startBtn">開始冒險 ▶</button>
    <div class="help-row">
      🎮 <b>左右鍵</b> 移動，<b>跳</b> 鈕跳躍<br>
      🦘 踩在敵人頭上把牠踩扁！<br>
      ⚡ 按住 <b>衝刺</b> 跑更快、跳更遠<br>
      🍄 吃蘑菇變大，吃星星無敵！<br>
      🚩 拿到金幣，碰旗桿就過關！
    </div>
  </div>
  <div class="credit">為小蛹與阿均打造 🌟</div>
</div>

<div class="overlay hidden" id="charScreen">
  <div class="title-logo" style="font-size:2.2rem;">選擇夥伴</div>
  <div class="title-sub" style="margin-bottom:4px;">挑一隻一起冒險！</div>
  <div class="char-grid" id="charGrid"></div>
  <div class="char-info" id="charInfo"></div>
  <button class="big-btn" id="charConfirm">就決定是你了！▶</button>
  <button class="small-btn" id="charBack" style="margin-top:10px;">← 返回</button>
</div>

<div class="overlay hidden" id="levelScreen">
  <div class="title-logo" style="font-size:2.4rem;">選擇關卡</div>
  <div class="lvl-grid" id="lvlGrid"></div>
  <button class="small-btn" id="backToMenu" style="margin-top:22px;">← 返回</button>
</div>

<div class="overlay hidden" id="resultScreen">
  <div class="hero-emoji" id="resultEmoji">🎉</div>
  <div class="result-title" id="resultTitle">過關！</div>
  <div class="result-stats" id="resultStats"></div>
  <div class="btn-row">
    <button class="small-btn" id="retryBtn">🔄 再玩一次</button>
    <button class="small-btn green" id="nextBtn">下一關 ▶</button>
    <button class="small-btn" id="mapBtn">🗺️ 選關</button>
  </div>
</div>

<div class="overlay hidden" id="pauseScreen">
  <div class="title-logo" style="font-size:2.4rem;">暫停</div>
  <div class="btn-row" style="margin-top:24px;flex-direction:column;align-items:center;">
    <button class="big-btn" id="resumeBtn">繼續遊戲 ▶</button>
    <button class="small-btn" id="quitBtn" style="margin-top:10px;">🗺️ 回到選關</button>
  </div>
</div>

/* ========================= 視口 ========================= */
var VW=0,VH=0,DPR=1,SCALE=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.floor(VW*DPR); cv.height=Math.floor(VH*DPR);
  cv.style.width=VW+'px'; cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // 邏輯縮放：畫面顯示約 11~13 格高
  SCALE=VH/(TILE*11.0);
  SCALE=Math.max(0.62, Math.min(SCALE,1.7));
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,250);});

/* ========================= 音效 ========================= */
var AC=null;
function audio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC && AC.state==='suspended'){ AC.resume(); }
  return AC;
}
function beep(freq,dur,type,vol){
  var a=audio(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    o.connect(g); g.connect(a.destination);
    var t=a.currentTime;
    g.gain.setValueAtTime(vol||0.07,t);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
function sfxJump(){ beep(520,0.11,'square',0.06); setTimeout(function(){beep(740,0.09,'square',0.045);},55); }
function sfxCoin(){ beep(988,0.05,'square',0.05); setTimeout(function(){beep(1319,0.09,'square',0.055);},50); }
function sfxStomp(){ beep(170,0.10,'square',0.08); beep(90,0.13,'sawtooth',0.045); }
function sfxHurt(){ beep(300,0.16,'sawtooth',0.09); setTimeout(function(){beep(150,0.22,'sawtooth',0.08);},80); }
function sfxPower(){ [523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,0.11,'square',0.06);},i*65);}); }

function sfxLose(){ [392,330,262,196].forEach(function(f,i){setTimeout(function(){beep(f,0.22,'sawtooth',0.075);},i*150);}); }
function sfx1up(){ [659,784,1047,1319].forEach(function(f,i){setTimeout(function(){beep(f,0.10,'triangle',0.07);},i*70);}); }
function sfxSpring(){ beep(400,0.08,'square',0.07); setTimeout(function(){beep(800,0.12,'square',0.06);},50); setTimeout(function(){beep(1200,0.10,'square',0.05);},110); }
function sfxBossJump(){ beep(120,0.18,'sawtooth',0.08); }

/* ========================= 存檔 ========================= */
function loadSave(){
  try{ var s=localStorage.getItem('pobbyAdventureV2'); if(s) return JSON.parse(s); }catch(e){}
  return {unlocked:1, stars:{}, bestCoins:{}, charIndex:0};

/* ========================= 載入關卡 ========================= */
function loadLevel(idx){
  levelIndex=idx;
  lvl=LEVELS[idx];
  theme=THEMES[lvl.theme]||THEMES.grass;
  timeLeft=lvl.time;
  coinCount=0;
  frame=0; shake=0; levelDone=false; doneTimer=0; isWin=false;
  enemies=[]; coins=[]; items=[]; blocks=[]; spikes=[]; particles=[]; floaters=[];
  movers=[]; pipes=[]; springs=[]; boss=null;
  flag=null;

  var rows=lvl.map;
  mapH=rows.length;
  mapW=0;
  for(var r=0;r<rows.length;r++){ if(rows[r].length>mapW) mapW=rows[r].length; }

  // grid: 0空 1實心 2磚 3問號 (內容) ...  用物件陣列描述每格
  grid=[];
  for(var y=0;y<mapH;y++){
    grid[y]=[];
    for(var x=0;x<mapW;x++){
      var ch=rows[y][x]||' ';
      grid[y][x]=tileType(ch);
      spawnFromChar(ch,x,y);
    }
  }
  // 玩家起點
  if(!player) player={};
  player.w=TILE*0.7; player.h=TILE*0.86;
  player.big=false; player.invuln=0; player.star=0;
  player.vx=0; player.vy=0; player.onGround=false; player.facing=1;
  player.coyote=0; player.jumpBuf=0; player.jumpFrames=0; player.dead=false;
  player.deadTimer=0; player.anim=0; player.win=false;
  // 找 S
  var sx=1,sy=mapH-3;
  for(var yy=0;yy<mapH;yy++) for(var xx=0;xx<mapW;xx++){ if((rows[yy][xx]||' ')==='S'){ sx=xx; sy=yy; } }
  player.x=sx*TILE; player.y=sy*TILE - (player.h-TILE);
  applyBigSize();

  buildBackground();
  cam.x=0; cam.y=0;
  updateHUD();
}

function tileType(ch){
  if(ch==='X'||ch==='=') return 1;       // 實心
  if(ch==='B') return 2;                 // 可破壞磚
  if(ch==='?'||ch==='M'||ch==='^') return 3; // 問號磚（未敲）
  if(ch==='p') return 4;                 // 穿越平台
  if(ch==='T'||ch==='I') return 1;       // 水管（實心可站可擋）
  return 0;
}
function spawnFromChar(ch,x,y){
  var px=x*TILE, py=y*TILE;
  if(ch==='o') coins.push({x:px+TILE*0.2,y:py+TILE*0.15,w:TILE*0.6,h:TILE*0.7,taken:false,anim:Math.random()*6});
  else if(ch==='g') enemies.push(mkEnemy('walk',px,py));
  else if(ch==='f') enemies.push(mkEnemy('fly',px,py));
  else if(ch==='j') enemies.push(mkEnemy('jump',px,py));   // 會跳的敵人
  else if(ch==='c') enemies.push(mkEnemy('charge',px,py));  // 衝刺殼怪
  else if(ch==='s') spikes.push({x:px,y:py+TILE*0.5,w:TILE,h:TILE*0.5});
  else if(ch==='?') blocks.push({x:px,y:py,type:'coin',used:false,bump:0});
  else if(ch==='M') blocks.push({x:px,y:py,type:'mushroom',used:false,bump:0});
  else if(ch==='^') blocks.push({x:px,y:py,type:'star',used:false,bump:0});
  else if(ch==='B') blocks.push({x:px,y:py,type:'brick',used:false,bump:0});
  else if(ch==='J') springs.push({x:px+TILE*0.1,y:py+TILE*0.55,w:TILE*0.8,h:TILE*0.45,comp:0});
  else if(ch==='H') movers.push({kind:'h',x:px,y:py+TILE*0.35,w:TILE*1.6,h:TILE*0.4,ox:px,oy:py+TILE*0.35,t:Math.random()*6,range:TILE*2.4,vx:0,vy:0,px:px,py:py+TILE*0.35});
  else if(ch==='V') movers.push({kind:'v',x:px,y:py,w:TILE*1.4,h:TILE*0.4,ox:px,oy:py,t:Math.random()*6,range:TILE*2.2,vx:0,vy:0,px:px,py:py});
  else if(ch==='T'){ pipes.push({x:px,y:py,spawned:false}); } // 水管頂（會吐敵人）
  else if(ch==='@'){ spawnBoss(px,py); }
  else if(ch==='|'){ if(!flag) flag={x:px+TILE*0.4,y:py,reached:false}; }
}
function mkEnemy(kind,x,y){
  if(kind==='fly'){
    return {kind:'fly',x:x,y:y,w:TILE*0.8,h:TILE*0.7,vx:0,vy:0,
      baseY:y, t:Math.random()*6, dir:-1, dead:false, deadTimer:0, squash:0, anim:0};
  }
  if(kind==='jump'){
    return {kind:'jump',x:x,y:y+TILE*0.14,w:TILE*0.82,h:TILE*0.82,vx:-0.6,vy:0,
      onGround:false, dead:false, deadTimer:0, squash:0, anim:0, jumpCd:rand(40,90)};
  }
  if(kind==='charge'){
    return {kind:'charge',x:x,y:y+TILE*0.2,w:TILE*0.86,h:TILE*0.7,vx:-1.0,vy:0,
      onGround:false, dead:false, deadTimer:0, squash:0, anim:0, shell:false, shellTimer:0};
  }
  return {kind:'walk',x:x,y:y+TILE*0.14,w:TILE*0.8,h:TILE*0.86,vx:-1.1,vy:0,
    onGround:false, dead:false, deadTimer:0, squash:0, anim:0};
}
function spawnBoss(px,py){
  boss={x:px,y:py,w:TILE*1.8,h:TILE*1.7,vx:1.4,vy:0,hp:3,maxhp:3,
    state:'walk', t:0, hurtT:0, stompCd:0, dead:false, deadTimer:0,
    baseY:py, anim:0, jumpCd:120};
}
function applyBigSize(){
  var feet=player.y+player.h;
  player.h = player.big? TILE*1.5 : TILE*0.86;
  player.w = player.big? TILE*0.78 : TILE*0.7;
  player.y = feet-player.h;
}

/* ========================= 碰撞輔助 ========================= */
function solidAt(tx,ty){
  if(ty<0) return false;
  if(tx<0||tx>=mapW||ty>=mapH) return (tx<0||tx>=mapW); // 左右牆，底下無
  var t=grid[ty][tx];
  return t===1||t===2||t===3;
}
function rectsOverlap(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

/* ====== 玩家對地圖碰撞（分軸解算）====== */
function movePlayerX(dx){
  player.x+=dx;
  var top=Math.floor(player.y/TILE);
  var bot=Math.floor((player.y+player.h-1)/TILE);
  if(dx>0){
    var rcol=Math.floor((player.x+player.w)/TILE);
    for(var y=top;y<=bot;y++){ if(solidAt(rcol,y)){ player.x=rcol*TILE-player.w-0.01; player.vx=0; break; } }
  }else if(dx<0){
    var lcol=Math.floor(player.x/TILE);
    for(var y2=top;y2<=bot;y2++){ if(solidAt(lcol,y2)){ player.x=(lcol+1)*TILE+0.01; player.vx=0; break; } }
  }
}
function movePlayerY(dy){
  player.y+=dy;
  var left=Math.floor(player.x/TILE);
  var right=Math.floor((player.x+player.w-1)/TILE);
  if(dy>0){ // 下落
    var brow=Math.floor((player.y+player.h)/TILE);
    for(var x=left;x<=right;x++){ if(solidAt(x,brow)){ player.y=brow*TILE-player.h-0.01; player.vy=0; player.onGround=true; return; } }
    player.onGround=false;
  }else if(dy<0){ // 上升，撞頂
    var trow=Math.floor(player.y/TILE);
    for(var x2=left;x2<=right;x2++){
      if(solidAt(x2,trow)){
        player.y=(trow+1)*TILE+0.01; player.vy=0;
        hitBlockFromBelow(x2,trow);
        break;
      }
    }
  }
}
function hitBlockFromBelow(tx,ty){
  // 找該格對應 block
  for(var i=0;i<blocks.length;i++){
    var b=blocks[i];
    if(Math.floor(b.x/TILE)===tx && Math.floor(b.y/TILE)===ty && !b.used){
      b.bump=8;
      if(b.type==='brick'){
        if(player.big){
          // 大波比打碎磚
          grid[ty][tx]=0; b.used=true; b.broken=true;
          sfxBrick(); addParticles(b.x+TILE/2,b.y+TILE/2,theme.brick,10,5); shake=4;
        }else{ sfxBump(); }
      }else if(b.type==='coin'){
        b.used=true; grid[ty][tx]=1;
        coinCount++; addFloat(b.x+TILE/2,b.y,'+1','#ffd166'); sfxCoin(); updateHUD();
        addParticles(b.x+TILE/2,b.y,'#ffd166',6,3);
      }else if(b.type==='mushroom'){
        b.used=true; grid[ty][tx]=1;
        items.push({kind:'mushroom',x:b.x,y:b.y-TILE,w:TILE*0.8,h:TILE*0.8,vx:1.4,vy:0,emerge:TILE,onGround:false});
        sfxBump();
      }else if(b.type==='star'){
        b.used=true; grid[ty][tx]=1;
        items.push({kind:'star',x:b.x,y:b.y-TILE,w:TILE*0.78,h:TILE*0.78,vx:1.8,vy:-4,emerge:TILE,onGround:false,anim:0});
        sfxBump();
      }
      return;
    }
  }
  sfxBump();
}

/* ====== 通用實體 vs 地圖（敵人、道具）====== */
function moveEntityX(e,dx){
  e.x+=dx;
  var top=Math.floor(e.y/TILE), bot=Math.floor((e.y+e.h-1)/TILE);
  if(dx>0){
    var rc=Math.floor((e.x+e.w)/TILE);
    for(var y=top;y<=bot;y++){ if(solidAt(rc,y)){ e.x=rc*TILE-e.w-0.01; e.vx=-Math.abs(e.vx); e.hitWall=true; return; } }
  }else if(dx<0){
    var lc=Math.floor(e.x/TILE);
    for(var y2=top;y2<=bot;y2++){ if(solidAt(lc,y2)){ e.x=(lc+1)*TILE+0.01; e.vx=Math.abs(e.vx); e.hitWall=true; return; } }
  }
}
function moveEntityY(e,dy){
  e.y+=dy;
  var left=Math.floor(e.x/TILE), right=Math.floor((e.x+e.w-1)/TILE);
  if(dy>0){
    var br=Math.floor((e.y+e.h)/TILE);
    for(var x=left;x<=right;x++){ if(solidAt(x,br)){ e.y=br*TILE-e.h-0.01; e.vy=0; e.onGround=true; return; } }
    e.onGround=false;
  }else if(dy<0){
    var tr=Math.floor(e.y/TILE);
    for(var x2=left;x2<=right;x2++){ if(solidAt(x2,tr)){ e.y=(tr+1)*TILE+0.01; e.vy=0; return; } }
  }
}

/* ========================= 更新：玩家 ========================= */
function updatePlayer(){
  if(player.win){
    // 過關小動畫：往下滑/走
    player.anim++;
    return;
  }
  if(player.dead){
    player.deadTimer++;
    player.vy+=GRAV;
    player.y+=player.vy;
    return;
  }
  var maxvx = keys.run? MAXVX_RUN : MAXVX_WALK;
  var onGnd = player.onGround;
  var acc = onGnd ? (MOVE*(keys.run?1.3:1)) : AIR_ACCEL; // 空中加速度較弱
  var KICK=2.0; // 地面按下瞬間最低初速，消除起步延遲
  if(keys.left){
    player.vx-=acc; player.facing=-1;
    if(onGnd && player.vx>-KICK) player.vx=-KICK;
  }
  if(keys.right){
    player.vx+=acc; player.facing=1;
    if(onGnd && player.vx<KICK) player.vx=KICK;
  }
  if(!keys.left && !keys.right){
    // 地面放開→乾脆停；空中放開→幾乎維持動量（跳遠飽滿）
    player.vx *= onGnd ? GROUND_FRICTION : AIR_FRICTION;
    if(Math.abs(player.vx)<0.05) player.vx=0;
  }
  // 速度上限：地面用 maxvx；空中以「起跳當下速度」為上限，維持動量但不暴衝
  var cap = onGnd ? maxvx : (player.airCap||maxvx);
  player.vx=clamp(player.vx,-cap,cap);

  // 跳躍：土狼+緩衝
  if(player.onGround) player.coyote=COYOTE; else if(player.coyote>0) player.coyote--;
  if(jumpJustPressed) player.jumpBuf=JUMP_BUFFER; else if(player.jumpBuf>0) player.jumpBuf--;

  if(player.jumpBuf>0 && player.coyote>0){
    player.vy=JUMP; player.onGround=false; player.coyote=0; player.jumpBuf=0;
    player.jumpFrames=JUMP_HOLD_FRAMES; sfxJump();
    player.airCap=Math.max(MAXVX_WALK, Math.abs(player.vx)); // 起跳瞬間速度→空中上限
    addParticles(player.x+player.w/2,player.y+player.h,'#fff',5,2);
  }
  // 可變跳躍高度
  if(player.jumpFrames>0 && jumpHeld && player.vy<0){ player.vy+=JUMP_HOLD; player.jumpFrames--; }
  else player.jumpFrames=0;

  player.vy+=GRAV;
  if(player.vy>MAXFALL) player.vy=MAXFALL;

  movePlayerX(player.vx);
  movePlayerY(player.vy);

  // 動畫計時
  if(Math.abs(player.vx)>0.3 && player.onGround) player.anim+=Math.abs(player.vx)*0.15;
  else player.anim=0;

  if(player.invuln>0) player.invuln--;
  if(player.star>0){ player.star--; if(player.star===0) flash(''); }

  // 掉出地圖 → 直接死（大隻也不能變小逃過）
  if(player.y>mapH*TILE+80){ hardKill(); }

  // 旗桿
  if(flag && !flag.reached){
    var fr={x:flag.x,y:flag.y,w:TILE*0.4,h:mapH*TILE};
    if(rectsOverlap(player,fr)){ winLevel(); }
  }
}

function killPlayer(){
  if(player.dead||player.win) return;
  // 無敵時間內（剛受傷或吃星星）→ 完全免傷
  if(player.invuln>0 || player.star>0) return;
  // 大隻被打 → 只會變小，並給一段無敵閃爍時間，絕不直接死
  if(player.big){
    player.big=false; applyBigSize(); player.invuln=90; sfxHurt(); shake=5;
    addParticles(player.x+player.w/2,player.y+player.h/2,'#fff',12,5);
    return;
  }
  // 小隻且非無敵 → 死亡
  player.dead=true; player.deadTimer=0; player.vy=-9; sfxHurt();
}
function hardKill(){ // 掉坑/尖刺直接死（不縮小）
  if(player.dead||player.win) return;
  player.dead=true; player.deadTimer=0; player.vy=-9; sfxLose();
}

function winLevel(){
  if(player.win) return;
  player.win=true; flag.reached=true; isWin=true;
  sfxWin(); flash('🚩 過關！');
  // 存檔：解鎖下一關
  var stars=calcStars();
  if(!save.stars[levelIndex] || save.stars[levelIndex]<stars) save.stars[levelIndex]=stars;
  if(!save.bestCoins[levelIndex] || save.bestCoins[levelIndex]<coinCount) save.bestCoins[levelIndex]=coinCount;
  if(levelIndex+1<LEVELS.length && save.unlocked<levelIndex+2) save.unlocked=levelIndex+2;
  persist();
  doneTimer=0; levelDone=true;
}
function calcStars(){
  var totalCoins=0;
  // 估算本關金幣總數
  for(var i=0;i<coins.length;i++) totalCoins++;
  // coins 陣列在收集後移除，改用收集數量分級
  var s=1;
  if(coinCount>=8) s=2;
  if(coinCount>=16) s=3;
  return s;
}

/* ========================= 更新：敵人 ========================= */
function updateEnemies(){
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.dead){
      e.deadTimer++;
      if(e.kind==='fly'){ e.y+=3; }
      if(e.deadTimer>22){ enemies.splice(i,1); }
      continue;
    }
    // 視野外不更新（效能）
    if(e.x<cam.x/SCALE-200 || e.x>cam.x/SCALE+VW/SCALE+200) { continue; }

    e.anim+=0.15;
    if(e.kind==='walk'){
      e.vy+=GRAV; if(e.vy>MAXFALL) e.vy=MAXFALL;
      e.hitWall=false;
      moveEntityX(e,e.vx);
      moveEntityY(e,e.vy);
      // 邊緣偵測：避免走出平台（簡單：腳下無地則回頭）
      if(e.onGround){
        var aheadX=e.vx>0? e.x+e.w+2 : e.x-2;
        var footTile=Math.floor((e.y+e.h+2)/TILE);
        var aheadTile=Math.floor(aheadX/TILE);
        if(!solidAt(aheadTile,footTile)){ e.vx=-e.vx; }
      }
    }else if(e.kind==='fly'){
      e.t+=0.05;
      e.y=e.baseY+Math.sin(e.t)*TILE*1.2;
      e.x+=e.dir*0.9;
      // 飛行怪左右巡邏，撞牆回頭
      var tcol=e.dir>0? Math.floor((e.x+e.w)/TILE):Math.floor(e.x/TILE);
      var tmid=Math.floor((e.y+e.h/2)/TILE);
      if(solidAt(tcol,tmid)) e.dir=-e.dir;
      // 巡邏範圍限制
      if(e.x<TILE) e.dir=1;
      if(e.x>mapW*TILE-TILE*2) e.dir=-1;
    }else if(e.kind==='jump'){
      e.vy+=GRAV; if(e.vy>MAXFALL) e.vy=MAXFALL;
      e.hitWall=false;
      moveEntityX(e,e.vx);
      moveEntityY(e,e.vy);
      if(e.onGround){
        e.jumpCd--;
        if(e.jumpCd<=0){
          e.vy=-9.5; e.onGround=false; e.jumpCd=rand(50,100);
          // 朝玩家方向微調
          e.vx = player.x<e.x? -0.9:0.9;
        }
        var ahead=e.vx>0? e.x+e.w+2:e.x-2;
        if(!solidAt(Math.floor(ahead/TILE),Math.floor((e.y+e.h+2)/TILE))) e.vx=-e.vx;
      }
    }else if(e.kind==='charge'){
      e.vy+=GRAV; if(e.vy>MAXFALL) e.vy=MAXFALL;
      e.hitWall=false;
      var spd=e.shell? e.vx : (e.vx>0?1.0:-1.0);
      moveEntityX(e, e.shell? e.vx : spd);
      moveEntityY(e,e.vy);
      if(e.hitWall && e.shell){ /* 殼撞牆反彈，已在moveEntityX處理vx反向 */ }
      if(!e.shell && e.onGround){
        var ah=spd>0? e.x+e.w+2:e.x-2;
        if(!solidAt(Math.floor(ah/TILE),Math.floor((e.y+e.h+2)/TILE))){ e.vx=-e.vx; }
      }
      // 殼撞到其他敵人
      if(e.shell && Math.abs(e.vx)>3){
        for(var ke=enemies.length-1;ke>=0;ke--){
          var o=enemies[ke];
          if(o!==e && !o.dead && rectsOverlap(e,o)){ killEnemy(o,ke); addFloat(o.x,o.y,'+100','#ffe66d'); }
        }
      }
    }

    // 與玩家互動
    if(!player.dead && !player.win && rectsOverlap(player,e)){
      var pBottom=player.y+player.h;
      var eMid=e.y+e.h*0.45;
      if(player.star>0){
        killEnemy(e,i); addFloat(e.x,e.y,'+200','#ff6bff');
      }else if(e.kind==='charge'){
        if(player.vy>0 && pBottom < eMid+12){
          // 踩殼怪
          if(!e.shell){ e.shell=true; e.vx=0; e.h=e.h*0.7; e.y+=e.h*0.4; }
          else if(Math.abs(e.vx)<1){ e.vx = player.x<e.x? 5.5:-5.5; } // 踢出殼
          else { e.vx=0; } // 踩停
          player.vy=keys.jump? -11:-7.5; sfxStomp(); addFloat(e.x,e.y,'+100','#ffe66d');
        }else if(e.shell && Math.abs(e.vx)>3){
          killPlayer(); // 被滾動的殼撞到
        }else if(e.shell && Math.abs(e.vx)<1){
          e.vx = player.x<e.x? 5.5:-5.5; sfxStomp(); // 側邊踢殼
        }else{
          killPlayer();
        }
      }else if(player.vy>0 && pBottom < eMid+10){
        killEnemy(e,i);
        player.vy=keys.jump? -11 : -7.5;
        sfxStomp(); addFloat(e.x,e.y,'+100','#ffe66d');
      }else{
        killPlayer();
      }
    }
  }
}
function coinScore(n){ }
function killEnemy(e,idx){
  e.dead=true; e.deadTimer=0; e.squash=1;
  var col = e.kind==='fly'?'#b06bff':(e.kind==='jump'?'#5ac85a':(e.kind==='charge'?'#5aa5e8':'#c0703a'));
  addParticles(e.x+e.w/2,e.y+e.h/2, col,10,4);
  if(e.kind==='walk'||e.kind==='charge'){ e.h=e.h*0.4; e.y+=e.h; }
}

/* ========================= 更新：道具/金幣 ========================= */
function updateItems(){
  // 金幣
  for(var i=coins.length-1;i>=0;i--){
    var c=coins[i]; c.anim+=0.18;
    if(!player.dead && !player.win && rectsOverlap(player,c)){
      coins.splice(i,1); coinCount++; sfxCoin(); updateHUD();
      addFloat(c.x,c.y,'+1','#ffd166'); addParticles(c.x+c.w/2,c.y+c.h/2,'#ffd166',6,3);
    }
  }
  // 道具
  for(var j=items.length-1;j>=0;j--){
    var it=items[j];
    if(it.emerge>0){ // 冒出動畫
      var step=Math.min(2,it.emerge); it.y-=step; it.emerge-=step;
      continue;
    }
    if(it.kind==='mushroom'){
      it.vy+=GRAV; if(it.vy>MAXFALL) it.vy=MAXFALL;
      it.hitWall=false; moveEntityX(it,it.vx);
      if(it.hitWall) it.vx=-it.vx;
      moveEntityY(it,it.vy);
    }else if(it.kind==='star'){
      it.anim=(it.anim||0)+0.2;
      it.vy+=GRAV*0.85; if(it.vy>MAXFALL) it.vy=MAXFALL;
      it.hitWall=false; moveEntityX(it,it.vx);
      if(it.hitWall) it.vx=-it.vx;
      var wasGround=it.onGround;
      moveEntityY(it,it.vy);
      if(it.onGround && !wasGround) it.vy=-7; // 星星彈跳
    }
    if(!player.dead && !player.win && rectsOverlap(player,it)){
      if(it.kind==='mushroom'){
        if(!player.big){ player.big=true; applyBigSize(); }
        sfxPower(); flash('🍄 變大了！'); addFloat(player.x,player.y,'+1000','#43d17a');
      }else if(it.kind==='star'){
        player.star=480; sfxPower(); flash('⭐ 無敵模式！');
      }
      addParticles(it.x+it.w/2,it.y+it.h/2,'#fff',12,5);
      items.splice(j,1);
    }
  }
}

/* ========================= 更新：移動平台 ========================= */
function updateMovers(){
  for(var i=0;i<movers.length;i++){
    var m=movers[i];
    m.px=m.x; m.py=m.y;
    m.t+=0.025;
    if(m.kind==='h'){ m.x=m.ox+Math.sin(m.t)*m.range; }
    else{ m.y=m.oy+Math.sin(m.t)*m.range; }
    m.vx=m.x-m.px; m.vy=m.y-m.py;
    // 玩家站在平台上 → 跟著移動
    if(!player.dead && !player.win){
      var onTop = player.vy>=0 &&
        player.x+player.w>m.x+3 && player.x<m.x+m.w-3 &&
        (player.y+player.h)>=m.y-2 && (player.y+player.h)<=m.y+m.h+8;
      if(onTop){
        player.y=m.y-player.h-0.01;
        player.x+=m.vx; player.vy=0; player.onGround=true; player.coyote=COYOTE;
        player.onMover=true;
      }
    }
  }
}

/* ========================= 更新：彈簧床 ========================= */
function updateSprings(){
  for(var i=0;i<springs.length;i++){
    var s=springs[i];
    if(s.comp>0) s.comp--;
    if(!player.dead && !player.win){
      var hit = player.vy>=0 &&
        player.x+player.w>s.x && player.x<s.x+s.w &&
        (player.y+player.h)>=s.y-2 && (player.y+player.h)<=s.y+s.h+6;
      if(hit){
        player.y=s.y-player.h-0.01;
        player.vy = keys.jump? -19 : -15;  // 超級彈跳！按住跳更高
        player.jumpFrames=JUMP_HOLD_FRAMES;
        s.comp=10; sfxSpring();
        addParticles(s.x+s.w/2,s.y,'#ffd166',8,4);
      }
    }
  }
}

/* ========================= 更新：水管吐怪 ========================= */
function updatePipes(){
  for(var i=0;i<pipes.length;i++){
    var p=pipes[i];
    // 在畫面內、冷卻好了，週期吐一隻飛行怪
    var onScreen = p.x>cam.x/SCALE-100 && p.x<cam.x/SCALE+VW/SCALE+100;
    if(p.cd===undefined) p.cd=rand(120,200);
    if(onScreen){
      p.cd--;
      if(p.cd<=0){
        p.cd=rand(180,300);
        // 限制同時數量避免太難
        var flyCount=0; for(var k=0;k<enemies.length;k++){ if(enemies[k].kind==='fly'&&!enemies[k].dead) flyCount++; }
        if(flyCount<6){
          var e=mkEnemy('fly',p.x,p.y-TILE*0.6);
          e.dir = player.x<p.x? -1:1;
          e.baseY=p.y-TILE*1.4; e.fromPipe=true;
          enemies.push(e);
          addParticles(p.x+TILE/2,p.y,'#5da83f',5,3);
        }
      }
    }
  }
}

/* ========================= 更新：Boss ========================= */
function updateBoss(){
  if(!boss) return;
  if(boss.dead){
    boss.deadTimer++;
    boss.y+=2; boss.anim+=0.3;
    if(boss.deadTimer>90 && !player.win){ winLevel(); }
    return;
  }
  boss.anim+=0.1;
  if(boss.hurtT>0) boss.hurtT--;
  if(boss.stompCd>0) boss.stompCd--;

  boss.vy+=GRAV; if(boss.vy>MAXFALL) boss.vy=MAXFALL;
  boss.t++;

  // 行為：左右走 + 週期跳向玩家
  moveEntityX(boss,boss.vx);
  if(boss.hitWall){ boss.vx=-boss.vx; }
  moveEntityY(boss,boss.vy);

  // 邊緣折返
  if(boss.onGround){
    var ah=boss.vx>0? boss.x+boss.w+2:boss.x-2;
    if(!solidAt(Math.floor(ah/TILE),Math.floor((boss.y+boss.h+2)/TILE))) boss.vx=-boss.vx;
    boss.jumpCd--;
    if(boss.jumpCd<=0){
      boss.vy=-11; boss.onGround=false; boss.jumpCd=rand(90,150);
      boss.vx = (player.x<boss.x?-1:1)*1.8;
      sfxBossJump();
    }
  }
  // 落地震動
  if(boss.onGround && boss.vy===0 && boss.wasAir){ shake=6; boss.wasAir=false; }
  if(!boss.onGround) boss.wasAir=true;

  // 與玩家互動
  if(!player.dead && !player.win && rectsOverlap(player,boss)){
    var pB=player.y+player.h, bMid=boss.y+boss.h*0.35;
    if((player.vy>0 && pB<bMid+14) || player.star>0){
      // 踩到頭 or 無敵撞 → 扣血
      if(boss.hurtT<=0){
        boss.hp--; boss.hurtT=60; sfxBossHurt(); shake=6;
        addParticles(boss.x+boss.w/2,boss.y,'#ff5a7a',16,6);
        player.vy=-11;
        if(boss.hp<=0){ boss.dead=true; boss.deadTimer=0; boss.vy=-6; sfxWin(); flash('👑 打敗大魔王！'); }
        else { flash('💥 還剩 '+boss.hp+' 滴血！'); boss.vx=(player.x<boss.x?1:-1)*2; }
      }else{ player.vy=-9; }
    }else if(player.star<=0 && boss.hurtT<=0){
      killPlayer();
    }
  }
}

/* ========================= 更新：尖刺/特效 ========================= */
function updateSpikes(){
  for(var i=0;i<spikes.length;i++){
    if(!player.dead && !player.win && player.star<=0 && rectsOverlap(player,spikes[i])){

function updateParticles(){
  for(var i=particles.length-1;i>=0;i--){

    if(p.life<=0) particles.splice(i,1);

    if(f.life<=0) floaters.splice(j,1);

  for(var k=0;k<blocks.length;k++){ if(blocks[k].bump>0) blocks[k].bump--; }
}

/* ========================= 相機 ========================= */
function updateCamera(){
  var targetX=(player.x+player.w/2)*SCALE - VW*0.42;
  var targetY=(player.y+player.h/2)*SCALE - VH*0.55;
  cam.x += (targetX-cam.x)*0.12;
  cam.y += (targetY-cam.y)*0.10;
  cam.x=clamp(cam.x,0, Math.max(0, mapW*TILE*SCALE - VW));
  cam.y=clamp(cam.y, -50, Math.max(0, mapH*TILE*SCALE - VH));
}

/* ========================= 繪製 ========================= */
function draw(){
  // 天空漸層
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,theme.sky1); g.addColorStop(1,theme.sky2);
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

  var sx=shake>0? rand(-shake,shake):0;
  var sy=shake>0? rand(-shake,shake):0;
  if(shake>0) shake-=0.6; if(shake<0) shake=0;

  ctx.save();
  ctx.translate(-cam.x+sx,-cam.y+sy);
  ctx.scale(SCALE,SCALE);

  drawBackground();
  drawTiles();
  drawPipes();
  drawMovers();
  drawSprings();
  drawCoins();
  drawItems();
  drawSpikes();
  drawEnemies();
  drawBoss();
  drawFlag();
  drawPlayer();
  drawParticles();
  drawFloaters();
  if(theme.underwater) drawWaterOverlay();

  ctx.restore();
}
function drawWaterOverlay(){
  // 水下藍色濾鏡與氣泡
  ctx.fillStyle='rgba(40,120,180,0.12)';
  ctx.fillRect(cam.x/SCALE,cam.y/SCALE,VW/SCALE,VH/SCALE);
  for(var i=0;i<6;i++){
    var bx=(cam.x/SCALE)+((frame*0.4+i*90)%(VW/SCALE));
    var by=(cam.y/SCALE+VH/SCALE)-((frame*1.2+i*130)%(VH/SCALE));
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(bx,by,3+i%3,0,7); ctx.fill();
  }
}

function drawBackground(){
  // 遠山
  ctx.fillStyle=theme.hill;
  var camWX=cam.x/SCALE;
  for(var i=0;i<bgHills.length;i++){
    var h=bgHills[i];
    var hx=h.x - camWX*0.3 + camWX; // 視差
    ctx.beginPath();
    ctx.arc(h.x, mapH*TILE-TILE*1.5, h.r, Math.PI,0);
    ctx.fill();
  }
  // 雲
  for(var c=0;c<bgClouds.length;c++){
    var cl=bgClouds[c];
    var cx=cl.x - (camWX*(1-cl.sp));
    cx=((cx%(mapW*TILE+400))+ (mapW*TILE+400))%(mapW*TILE+400)-200;
    drawCloud(cx, cl.y/SCALE + (cam.y/SCALE), cl.s);
  }
}
function drawCloud(x,y,s){
  ctx.fillStyle=theme.cloud; ctx.globalAlpha=0.85;
  ctx.beginPath();
  ctx.arc(x,y,22*s,0,7); ctx.arc(x+26*s,y-8*s,28*s,0,7);
  ctx.arc(x+54*s,y,22*s,0,7); ctx.arc(x+28*s,y+8*s,24*s,0,7);
  ctx.fill(); ctx.globalAlpha=1;
}

function drawTiles(){
  var x0=Math.floor(cam.x/SCALE/TILE)-1;
  var x1=Math.ceil((cam.x/SCALE+VW/SCALE)/TILE)+1;
  var y0=Math.floor(cam.y/SCALE/TILE)-1;
  var y1=Math.ceil((cam.y/SCALE+VH/SCALE)/TILE)+1;
  for(var y=Math.max(0,y0);y<Math.min(mapH,y1);y++){
    for(var x=Math.max(0,x0);x<Math.min(mapW,x1);x++){
      var t=grid[y][x];
      if(t===0) continue;
      var px=x*TILE, py=y*TILE;
      if(t===1){ drawGroundTile(px,py,x,y); }
    }
  }
  // blocks（磚/問號）單獨畫，有 bump 動畫
  for(var b=0;b<blocks.length;b++){
    var bl=blocks[b];
    if(bl.broken) continue;
    if(bl.x<cam.x/SCALE-TILE || bl.x>cam.x/SCALE+VW/SCALE+TILE) continue;
    drawBlock(bl);
  }
}
function drawGroundTile(px,py,tx,ty){
  var topOpen = ty===0 || grid[ty-1][tx]===0;
  ctx.fillStyle=theme.ground;
  ctx.fillRect(px,py,TILE,TILE);
  if(topOpen){
    ctx.fillStyle=theme.groundTop;
    ctx.fillRect(px,py,TILE,TILE*0.28);
  }
  // 紋理小點
  ctx.fillStyle='rgba(0,0,0,0.08)';
  ctx.fillRect(px+TILE*0.18,py+TILE*0.5,4,4);
  ctx.fillRect(px+TILE*0.62,py+TILE*0.72,4,4);
  ctx.strokeStyle='rgba(0,0,0,0.10)'; ctx.lineWidth=1.5;
  ctx.strokeRect(px+0.5,py+0.5,TILE-1,TILE-1);
}
function drawBlock(b){
  var off=b.bump>0? -b.bump:0;
  var px=b.x, py=b.y+off;
  if(b.type==='brick'){
    ctx.fillStyle=theme.brick; ctx.fillRect(px,py,TILE,TILE);
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2;
    ctx.strokeRect(px+1,py+1,TILE-2,TILE-2);
    ctx.beginPath();
    ctx.moveTo(px,py+TILE/2); ctx.lineTo(px+TILE,py+TILE/2);
    ctx.moveTo(px+TILE/2,py); ctx.lineTo(px+TILE/2,py+TILE/2);
    ctx.moveTo(px+TILE*0.25,py+TILE/2); ctx.lineTo(px+TILE*0.25,py+TILE);
    ctx.moveTo(px+TILE*0.75,py+TILE/2); ctx.lineTo(px+TILE*0.75,py+TILE);
    ctx.stroke();
  }else{
    // 問號磚（未敲=金黃發亮；敲過=咖啡空磚）
    if(b.used){
      ctx.fillStyle='#8a6d3a'; ctx.fillRect(px,py,TILE,TILE);
      ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2; ctx.strokeRect(px+2,py+2,TILE-4,TILE-4);
    }else{
      var pulse=0.5+0.5*Math.sin(frame*0.1+px*0.05);
      ctx.fillStyle='#f0a500'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='rgba(255,255,200,'+(0.3+pulse*0.4)+')';
      ctx.fillRect(px+3,py+3,TILE-6,TILE-6);
      ctx.fillStyle='#fff'; ctx.font='900 '+(TILE*0.6)+'px Trebuchet MS';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      var sym=b.type==='mushroom'?'?':(b.type==='star'?'★':'?');
      ctx.fillText(b.type==='star'?'★':'?', px+TILE/2, py+TILE/2+1);
      // 角落鉚釘
      ctx.fillStyle='#b87900';
      [[5,5],[TILE-9,5],[5,TILE-9],[TILE-9,TILE-9]].forEach(function(c){ ctx.fillRect(px+c[0],py+c[1],3,3); });
    }
  }
}

function drawCoins(){

function drawItems(){
  for(var i=0;i<items.length;i++){
    var it=items[i], cx=it.x+it.w/2, cy=it.y+it.h/2;
    if(it.kind==='mushroom'){
      ctx.fillStyle='#fff'; ctx.fillRect(it.x+it.w*0.22,cy,it.w*0.56,it.h*0.45); // 柄
      ctx.fillStyle='#e8472e';
      ctx.beginPath(); ctx.arc(cx,cy,it.w*0.5,Math.PI,0); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(cx-it.w*0.2,cy-it.h*0.12,it.w*0.1,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+it.w*0.2,cy-it.h*0.12,it.w*0.1,0,7); ctx.fill();
    }else if(it.kind==='star'){
      drawStar(cx,cy,it.w*0.5, '#ffe66d', (it.anim||0));
    }
  }
}
function drawStar(cx,cy,r,color,rot){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot*0.5);
  ctx.fillStyle=color; ctx.beginPath();
  for(var i=0;i<5;i++){
    var a=-Math.PI/2 + i*Math.PI*2/5;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    var a2=a+Math.PI/5;
    ctx.lineTo(Math.cos(a2)*r*0.45, Math.sin(a2)*r*0.45);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#f0a500'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
}
function drawSpikes(){
  ctx.fillStyle='#9aa5b5';
  for(var i=0;i<spikes.length;i++){
    var s=spikes[i];
    if(s.x<cam.x/SCALE-TILE || s.x>cam.x/SCALE+VW/SCALE+TILE) continue;
    var n=3;
    for(var k=0;k<n;k++){
      var sx=s.x+k*(s.w/n);
      ctx.beginPath();
      ctx.moveTo(sx,s.y+s.h);
      ctx.lineTo(sx+s.w/n/2,s.y);
      ctx.lineTo(sx+s.w/n,s.y+s.h);
      ctx.fill();
    }
    ctx.fillStyle='#6b7585'; ctx.fillRect(s.x,s.y+s.h-3,s.w,3); ctx.fillStyle='#9aa5b5';
  }
}

function drawEnemies(){
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.x<cam.x/SCALE-TILE*2 || e.x>cam.x/SCALE+VW/SCALE+TILE*2) continue;
    var cx=e.x+e.w/2, cy=e.y+e.h/2;
    if(e.kind==='walk'){
      var sq=e.dead?0.4:1;
      // 身體（栗子怪）
      ctx.fillStyle=e.dead?'#8a5a2a':'#9c5a2a';
      ctx.beginPath(); ctx.ellipse(cx,e.y+e.h*0.55, e.w*0.5, e.h*0.45*sq, 0,0,7); ctx.fill();
      if(!e.dead){
        // 腳
        var legPhase=Math.sin(e.anim)*3;
        ctx.fillStyle='#5a3415';
        ctx.fillRect(e.x+e.w*0.15, e.y+e.h*0.82, e.w*0.25, e.h*0.18);
        ctx.fillRect(e.x+e.w*0.6, e.y+e.h*0.82, e.w*0.25, e.h*0.18);
        // 眼睛
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(cx-e.w*0.16,cy-e.h*0.05,e.w*0.13,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+e.w*0.16,cy-e.h*0.05,e.w*0.13,0,7); ctx.fill();
        ctx.fillStyle='#000';
        var ed=e.vx<0?-1:1;
        ctx.beginPath(); ctx.arc(cx-e.w*0.16+ed*2,cy-e.h*0.05,e.w*0.06,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+e.w*0.16+ed*2,cy-e.h*0.05,e.w*0.06,0,7); ctx.fill();
        // 怒眉
        ctx.strokeStyle='#000'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(cx-e.w*0.3,cy-e.h*0.2); ctx.lineTo(cx-e.w*0.05,cy-e.h*0.1);
        ctx.moveTo(cx+e.w*0.3,cy-e.h*0.2); ctx.lineTo(cx+e.w*0.05,cy-e.h*0.1); ctx.stroke();
      }
    }else if(e.kind==='jump'){
      // 跳跳怪（綠色青蛙狀）
      var sq2 = e.dead?0.4:(e.onGround?1:1.12);
      ctx.fillStyle=e.dead?'#4a8a3a':'#5da83f';
      ctx.beginPath(); ctx.ellipse(cx,e.y+e.h*0.5,e.w*0.48,e.h*0.46*sq2,0,0,7); ctx.fill();
      if(!e.dead){
        // 後腿
        ctx.fillStyle='#4a8a2f';
        ctx.beginPath(); ctx.ellipse(e.x+e.w*0.2,e.y+e.h*0.8,e.w*0.18,e.h*0.14,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(e.x+e.w*0.8,e.y+e.h*0.8,e.w*0.18,e.h*0.14,0,0,7); ctx.fill();
        // 大眼睛凸起
        ctx.fillStyle='#7ac85a';
        ctx.beginPath(); ctx.arc(cx-e.w*0.2,e.y+e.h*0.18,e.w*0.16,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+e.w*0.2,e.y+e.h*0.18,e.w*0.16,0,7); ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(cx-e.w*0.2,e.y+e.h*0.16,e.w*0.1,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+e.w*0.2,e.y+e.h*0.16,e.w*0.1,0,7); ctx.fill();
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(cx-e.w*0.2,e.y+e.h*0.17,e.w*0.05,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+e.w*0.2,e.y+e.h*0.17,e.w*0.05,0,7); ctx.fill();
        // 微笑
        ctx.strokeStyle='#2a5a1a'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(cx,cy+e.h*0.05,e.w*0.2,0.1,Math.PI-0.1); ctx.stroke();
      }
    }else if(e.kind==='charge'){
      // 殼怪（烏龜）
      if(e.shell){
        // 縮進殼
        ctx.fillStyle=e.dead?'#3a7a8a':'#2a8ab5';
        ctx.beginPath(); ctx.ellipse(cx,cy,e.w*0.5,e.h*0.55,0,0,7); ctx.fill();
        ctx.fillStyle='#1a6a95';
        for(var hx=-1;hx<=1;hx++) for(var hy=-1;hy<=1;hy++){
          ctx.beginPath(); ctx.arc(cx+hx*e.w*0.22,cy+hy*e.h*0.22,e.w*0.08,0,7); ctx.fill();
        }
        if(Math.abs(e.vx)>3){ // 滾動星星
          ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2;
          ctx.beginPath(); ctx.arc(cx,cy,e.w*0.6,frame*0.3,frame*0.3+2); ctx.stroke();
        }
      }else{
        var sq3=e.dead?0.4:1;
        // 殼
        ctx.fillStyle=e.dead?'#3a7a8a':'#2a8ab5';
        ctx.beginPath(); ctx.ellipse(cx,e.y+e.h*0.45,e.w*0.46,e.h*0.45*sq3,0,0,7); ctx.fill();
        if(!e.dead){
          // 頭
          var hd=e.vx<0?-1:1;
          ctx.fillStyle='#7ac88a';
          ctx.beginPath(); ctx.arc(cx+hd*e.w*0.4,e.y+e.h*0.4,e.w*0.18,0,7); ctx.fill();
          // 腳
          ctx.fillStyle='#6ab87a';
          ctx.fillRect(e.x+e.w*0.15,e.y+e.h*0.78,e.w*0.2,e.h*0.2);
          ctx.fillRect(e.x+e.w*0.6,e.y+e.h*0.78,e.w*0.2,e.h*0.2);
          // 殼紋
          ctx.strokeStyle='#1a6a95'; ctx.lineWidth=2;
          ctx.beginPath(); ctx.ellipse(cx,e.y+e.h*0.45,e.w*0.3,e.h*0.3,0,0,7); ctx.stroke();
          // 眼
          ctx.fillStyle='#000';
          ctx.beginPath(); ctx.arc(cx+hd*e.w*0.42,e.y+e.h*0.36,e.w*0.04,0,7); ctx.fill();
        }
      }
    }else{
      // 飛行怪（蝙蝠/小飛蟲）
      var flap=Math.sin(e.anim*1.5)*e.w*0.3;
      ctx.fillStyle=e.dead?'#7a4aaa':'#9c5ad0';
      ctx.beginPath(); ctx.ellipse(cx,cy,e.w*0.36,e.h*0.4,0,0,7); ctx.fill();
      if(!e.dead){
        // 翅膀
        ctx.fillStyle='#b985e8';
        ctx.beginPath(); ctx.ellipse(cx-e.w*0.4,cy-flap*0.2,e.w*0.32,e.h*0.22,-0.5,0,7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx+e.w*0.4,cy-flap*0.2,e.w*0.32,e.h*0.22,0.5,0,7); ctx.fill();
        // 眼睛
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(cx-e.w*0.12,cy-e.h*0.05,e.w*0.1,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+e.w*0.12,cy-e.h*0.05,e.w*0.1,0,7); ctx.fill();
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(cx-e.w*0.12,cy-e.h*0.05,e.w*0.05,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+e.w*0.12,cy-e.h*0.05,e.w*0.05,0,7); ctx.fill();
      }
    }
  }
}

function drawSprings(){

function drawBoss(){
  if(!boss) return;
  var cx=boss.x+boss.w/2, cy=boss.y+boss.h/2;
  var hurt = boss.hurtT>0 && Math.floor(boss.hurtT/4)%2===0;
  ctx.save();
  ctx.translate(cx,cy);
  var sq=1+Math.sin(boss.anim)*0.04;
  ctx.scale(boss.vx<0?-1:1, 1);
  ctx.scale(1, sq);
  ctx.fillStyle=hurt?'#ffffff':(boss.dead?'#5a3a6a':'#6a2a8a');
  roundRectC(-boss.w/2, -boss.h/2, boss.w, boss.h, 14); ctx.fill();
  ctx.fillStyle=hurt?'#ffd5e0':'#9c5ad0';
  roundRectC(-boss.w*0.3, -boss.h*0.1, boss.w*0.6, boss.h*0.5, 10); ctx.fill();
  ctx.fillStyle=hurt?'#fff':'#3a1550';
  ctx.beginPath(); ctx.moveTo(-boss.w*0.4,-boss.h*0.45); ctx.lineTo(-boss.w*0.55,-boss.h*0.75); ctx.lineTo(-boss.w*0.25,-boss.h*0.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(boss.w*0.4,-boss.h*0.45); ctx.lineTo(boss.w*0.55,-boss.h*0.75); ctx.lineTo(boss.w*0.25,-boss.h*0.5); ctx.fill();
  if(!boss.dead){
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-boss.w*0.18,-boss.h*0.12,boss.w*0.13,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(boss.w*0.18,-boss.h*0.12,boss.w*0.13,0,7); ctx.fill();
    ctx.fillStyle='#e8472e';
    ctx.beginPath(); ctx.arc(-boss.w*0.18,-boss.h*0.12,boss.w*0.06,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(boss.w*0.18,-boss.h*0.12,boss.w*0.06,0,7); ctx.fill();
    ctx.strokeStyle=hurt?'#fff':'#2a0a3a'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(-boss.w*0.32,-boss.h*0.28); ctx.lineTo(-boss.w*0.05,-boss.h*0.16);
    ctx.moveTo(boss.w*0.32,-boss.h*0.28); ctx.lineTo(boss.w*0.05,-boss.h*0.16); ctx.stroke();
    ctx.fillStyle='#2a0a3a'; roundRectC(-boss.w*0.2,boss.h*0.12,boss.w*0.4,boss.h*0.14,4); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(-boss.w*0.12,boss.h*0.12); ctx.lineTo(-boss.w*0.06,boss.h*0.22); ctx.lineTo(0,boss.h*0.12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(boss.w*0.12,boss.h*0.12); ctx.lineTo(boss.w*0.06,boss.h*0.22); ctx.lineTo(0,boss.h*0.12); ctx.fill();
  }else{
    ctx.fillStyle='#fff'; ctx.font=(boss.h*0.4)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('💫',0,-boss.h*0.1);
  }
  ctx.restore();
  if(!boss.dead){
    var bw=boss.w*1.2, bx=cx-bw/2, by=boss.y-18;
    ctx.fillStyle='rgba(0,0,0,0.4)'; roundRect(bx-2,by-2,bw+4,12,4); ctx.fill();
    for(var h=0;h<boss.maxhp;h++){
      ctx.fillStyle = h<boss.hp? '#ff3a5a':'#553040';
      roundRect(bx+h*(bw/boss.maxhp)+2, by, bw/boss.maxhp-4, 8, 3); ctx.fill();
    }
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function roundRectC(x,y,w,h,r){ roundRect(x,y,w,h,r); }

function drawFlag(){
  if(!flag) return;
  var fx=flag.x, top=0;
  // 找旗桿底
  var poleBottom=mapH*TILE;
  for(var y=0;y<mapH;y++){ if(solidAt(Math.floor(fx/TILE),y)){ poleBottom=y*TILE; break; } }
  var poleTop=poleBottom-TILE*7;
  // 桿
  ctx.fillStyle='#cfd8dc'; ctx.fillRect(fx-3,poleTop,6,poleBottom-poleTop);
  // 球
  ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(fx,poleTop,7,0,7); ctx.fill();
  // 旗
  var wave=Math.sin(frame*0.1)*4;
  ctx.fillStyle='#43d17a';
  ctx.beginPath();
  ctx.moveTo(fx+2,poleTop+8);
  ctx.lineTo(fx+TILE*0.9+wave,poleTop+TILE*0.55);
  ctx.lineTo(fx+2,poleTop+TILE*1.0);
  ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='900 '+(TILE*0.5)+'px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏁', fx+TILE*0.4, poleTop+TILE*0.55);
}

function drawPlayer(){
  if(player.dead && player.deadTimer>0){
    // 死亡：旋轉墜落的波比
    ctx.save();
    ctx.translate(player.x+player.w/2, player.y+player.h/2);
    ctx.rotate(player.deadTimer*0.2);
    ctx.font=(player.h*1.1)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('😵', 0,0);
    ctx.restore();
    return;
  }
  // 受傷閃爍
  if(player.invuln>0 && Math.floor(player.invuln/4)%2===0 && player.star<=0){ return; }

  var cx=player.x+player.w/2, cy=player.y+player.h/2;
  var bounce = player.onGround? Math.abs(Math.sin(player.anim))*2 : 0;

  ctx.save();
  ctx.translate(cx, cy+bounce*0 );
  // 無敵彩光
  if(player.star>0){
    var hue=(frame*12)%360;
    ctx.shadowColor='hsl('+hue+',90%,60%)'; ctx.shadowBlur=16;
  }
  ctx.scale(player.facing, 1);
  var sqx = !player.onGround ? (player.vy<0?0.93:1.07) : 1;
  var sqy = !player.onGround ? (player.vy<0?1.08:0.93) : 1;
  ctx.scale(sqx, sqy);
  // 身體：依所選角色
  var bw=player.w, bh=player.h;
  var ch=curChar();
  var bodyColor = player.star>0? 'hsl('+((frame*12)%360)+',80%,65%)' : (player.big?ch.bodyBig:ch.body);
  // 身
  ctx.fillStyle=bodyColor;
  ctx.beginPath(); ctx.ellipse(0,bh*0.05,bw*0.5,bh*0.46,0,0,7); ctx.fill();
  // 肚子
  ctx.fillStyle='#fff6e0';
  ctx.beginPath(); ctx.ellipse(0,bh*0.12,bw*0.3,bh*0.32,0,0,7); ctx.fill();
  // 耳朵 / 頭部特徵（依角色）
  ctx.fillStyle=bodyColor;
  if(ch.id==='coco'){ // 兔子長耳
    ctx.beginPath(); ctx.ellipse(-bw*0.2,-bh*0.55,bw*0.1,bh*0.28,-0.2,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bw*0.2,-bh*0.55,bw*0.1,bh*0.28,0.2,0,7); ctx.fill();
    ctx.fillStyle=ch.ear;
    ctx.beginPath(); ctx.ellipse(-bw*0.2,-bh*0.55,bw*0.05,bh*0.18,-0.2,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bw*0.2,-bh*0.55,bw*0.05,bh*0.18,0.2,0,7); ctx.fill();
  }else if(ch.id==='mochi'){ // 貓尖耳
    ctx.beginPath(); ctx.moveTo(-bw*0.38,-bh*0.3); ctx.lineTo(-bw*0.42,-bh*0.6); ctx.lineTo(-bw*0.15,-bh*0.4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bw*0.38,-bh*0.3); ctx.lineTo(bw*0.42,-bh*0.6); ctx.lineTo(bw*0.15,-bh*0.4); ctx.fill();
    ctx.fillStyle=ch.ear;
    ctx.beginPath(); ctx.moveTo(-bw*0.33,-bh*0.35); ctx.lineTo(-bw*0.36,-bh*0.52); ctx.lineTo(-bw*0.2,-bh*0.4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bw*0.33,-bh*0.35); ctx.lineTo(bw*0.36,-bh*0.52); ctx.lineTo(bw*0.2,-bh*0.4); ctx.fill();
  }else if(ch.id==='pengu'){ // 企鵝小頭頂
    ctx.beginPath(); ctx.ellipse(0,-bh*0.3,bw*0.42,bh*0.3,0,0,7); ctx.fill();
  }else if(ch.id==='kuma'){ // 熊圓耳
    ctx.beginPath(); ctx.arc(-bw*0.3,-bh*0.42,bw*0.14,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(bw*0.3,-bh*0.42,bw*0.14,0,7); ctx.fill();
    ctx.fillStyle=ch.ear;
    ctx.beginPath(); ctx.arc(-bw*0.3,-bh*0.42,bw*0.07,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(bw*0.3,-bh*0.42,bw*0.07,0,7); ctx.fill();
  }else if(ch.id==='froggy'){ // 青蛙凸眼
    ctx.beginPath(); ctx.arc(-bw*0.22,-bh*0.42,bw*0.16,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(bw*0.22,-bh*0.42,bw*0.16,0,7); ctx.fill();
  }else{ // 倉鼠圓耳（預設）
    ctx.beginPath(); ctx.arc(-bw*0.28,-bh*0.4,bw*0.16,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(bw*0.28,-bh*0.4,bw*0.16,0,7); ctx.fill();
    ctx.fillStyle=ch.ear;
    ctx.beginPath(); ctx.arc(-bw*0.28,-bh*0.4,bw*0.08,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(bw*0.28,-bh*0.4,bw*0.08,0,7); ctx.fill();
  }
  // 腳（走路擺動）
  var lp=player.onGround? Math.sin(player.anim)*bw*0.18:bw*0.1;
  ctx.fillStyle=ch.foot;
  ctx.beginPath(); ctx.ellipse(-bw*0.18+lp, bh*0.46, bw*0.14,bh*0.08,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bw*0.18-lp, bh*0.46, bw*0.14,bh*0.08,0,0,7); ctx.fill();
  // 眼睛
  if(ch.id==='froggy'){
    // 青蛙眼睛在凸起上
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-bw*0.22,-bh*0.42,bw*0.09,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(bw*0.22,-bh*0.42,bw*0.09,0,7); ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.arc(-bw*0.2,-bh*0.42,bw*0.05,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(bw*0.24,-bh*0.42,bw*0.05,0,7); ctx.fill();
  }else{
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(bw*0.05,-bh*0.12,bw*0.15,0,7); ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.arc(bw*0.1,-bh*0.12,bw*0.08,0,7); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(bw*0.13,-bh*0.15,bw*0.03,0,7); ctx.fill();
  }
  // 鼻/嘴（企鵝畫橘色喙）
  if(ch.id==='pengu'){
    ctx.fillStyle='#ffb84d';
    ctx.beginPath(); ctx.moveTo(bw*0.22,-bh*0.06); ctx.lineTo(bw*0.4,0); ctx.lineTo(bw*0.22,bh*0.04); ctx.fill();
  }else{
    ctx.fillStyle=ch.ear;
    ctx.beginPath(); ctx.arc(bw*0.28,-bh*0.02,bw*0.06,0,7); ctx.fill();
  }
  // 腮紅
  ctx.fillStyle='rgba(247,169,192,0.5)';
  ctx.beginPath(); ctx.arc(-bw*0.1,bh*0.02,bw*0.1,0,7); ctx.fill();
  ctx.restore();
  ctx.shadowBlur=0;
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=clamp(p.life/30,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
}
function drawFloaters(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(var i=0;i<floaters.length;i++){
    var f=floaters[i];
    ctx.globalAlpha=clamp(f.life/40,0,1);
    ctx.font='900 '+(TILE*0.5)+'px Trebuchet MS';
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillText(f.txt,f.x+1.5,f.y+1.5);
    ctx.fillStyle=f.color;
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

/* ========================= HUD ========================= */
function updateHUD(){
  elLives.textContent=lives;
  elCoins.textContent=coinCount;
  elWorld.textContent=(levelIndex+1)+'-'+(lvl?lvl.name:'');
}

/* ========================= 主迴圈 ========================= */
var lastT=0, acc=0, STEP=1000/60;
function loop(t){
  requestAnimationFrame(loop);
  if(state!=='play'){ lastT=t; return; }
  if(!lastT) lastT=t;
  var dt=t-lastT; lastT=t;
  if(dt>100) dt=100;
  acc+=dt;
  var steps=0;
  while(acc>=STEP && steps<4){
    tick();
    acc-=STEP; steps++;
  }
  draw();
}
function tick(){
  frame++;
  // 計時
  if(frame%60===0 && !levelDone){ timeLeft--; if(timeLeft<=0){ timeLeft=0; hardKill(); } updateHUD(); }

  updatePlayer();
  updateMovers();
  updateEnemies();
  updatePipes();
  updateSprings();
  updateBoss();
  updateItems();
  updateSpikes();
  updateParticles();
  updateCamera();

  jumpJustPressed=false;

  // 死亡 / 過關後處理
  if(player.dead){
    doneTimer++;
    if(doneTimer>70){ doneTimer=0; onPlayerDeadEnd(); }
  }
  if(player.win){
    doneTimer++;
    if(doneTimer>110){ doneTimer=0; showResult(true); }
  }
}
function onPlayerDeadEnd(){
  lives--;
  updateHUD();
  if(lives<=0){ showResult(false); }
  else { loadLevel(levelIndex); /* 重生 */ }
}

/* ========================= 畫面切換 ========================= */
function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }
function hideAllOverlays(){ ['menuScreen','charScreen','levelScreen','resultScreen','pauseScreen'].forEach(hide); }

function gotoMenu(){
  state='menu'; hideAllOverlays(); show('menuScreen');
  hide('hud'); hide('controls'); hide('pauseBtn');
}
function gotoCharSelect(){
  state='char'; hideAllOverlays(); show('charScreen');
  hide('hud'); hide('controls'); hide('pauseBtn');
  buildCharGrid();
}
function buildCharGrid(){
  var g=document.getElementById('charGrid');
  g.innerHTML='';
  for(var i=0;i<CHARACTERS.length;i++){
    (function(idx){
      var c=CHARACTERS[idx];
      var btn=document.createElement('button');
      btn.className='char-btn'+(idx===charIndex?' selected':'');
      btn.innerHTML=c.emoji+'<span class="char-check">✅</span>';
      btn.onclick=function(){
        charIndex=idx; persist(); sfxCoin();
        buildCharGrid(); updateCharInfo();
      };
      g.appendChild(btn);
    })(i);
  }
  updateCharInfo();
}
function updateCharInfo(){
  var c=CHARACTERS[charIndex];
  document.getElementById('charInfo').innerHTML='<span class="cname">'+c.name+'</span>　'+c.desc;
}
function gotoLevelSelect(){
  state='level'; hideAllOverlays(); show('levelScreen');
  hide('hud'); hide('controls'); hide('pauseBtn');
  buildLevelGrid();
}
function startLevel(idx){
  lives=3;
  loadLevel(idx);
  state='play'; hideAllOverlays();
  show('hud'); show('controls'); show('pauseBtn');
  updateHUD();
  audio(); // 解鎖音訊（在使用者手勢中）
}
function showResult(win){
  state='result';
  hide('controls'); hide('pauseBtn');
  show('resultScreen');
  var emoji=document.getElementById('resultEmoji');
  var title=document.getElementById('resultTitle');
  var stats=document.getElementById('resultStats');
  var nextBtn=document.getElementById('nextBtn');
  if(win){
    var stars=save.stars[levelIndex]||1;
    var starStr='⭐'.repeat(stars)+'☆'.repeat(3-stars);
    emoji.textContent='🎉'; title.textContent='過關啦！'; title.className='result-title win';
    stats.innerHTML=starStr+'<br>🪙 金幣：'+coinCount+'　⏱️ 剩餘：'+timeLeft;
    if(levelIndex+1<LEVELS.length){ nextBtn.style.display=''; }
    else{ nextBtn.style.display='none'; title.textContent='🏆 全破啦！'; stats.innerHTML=starStr+'<br>你救出了波比王國！太厲害了！'; }
    sfxWin();
  }else{
    emoji.textContent='😢'; title.textContent='遊戲結束'; title.className='result-title lose';
    stats.innerHTML='別灰心，再試一次！<br>🪙 收集了 '+coinCount+' 金幣';
    nextBtn.style.display='none';
    sfxLose();
  }
}

/* ========================= 選關格子 ========================= */
function buildLevelGrid(){
  var gridEl=document.getElementById('lvlGrid');
  gridEl.innerHTML='';
  for(var i=0;i<LEVELS.length;i++){
    (function(idx){
      var unlocked = (idx+1)<=save.unlocked;
      var btn=document.createElement('button');
      btn.className='lvl-btn'+(unlocked?'':' locked');
      var stars=save.stars[idx]||0;
      var starHtml = unlocked && stars>0 ? '<div class="lvl-star">'+'⭐'.repeat(stars)+'</div>' : '';
      btn.innerHTML = starHtml +
        '<div>'+(unlocked? (idx+1):'🔒')+'</div>'+
        '<div class="lvl-name">'+LEVELS[idx].name+'</div>';
      if(unlocked){ btn.onclick=function(){ startLevel(idx); }; }
      gridEl.appendChild(btn);
    })(i);
  }
}

/* ========================= 輸入 ========================= */
/* ====== 觸控核心：全域 pointer 追蹤 ======
   每根手指記錄壓在哪個鍵；移動時即時重算（可滑動切換左右）；
   放開或滑出畫面正確釋放。解決手機「不靈敏 / 卡鍵」問題。 */
var touchBtns=[];
var activePointers={}; // pointerId -> 按鍵id

function btnIdAt(x,y){
  var el=document.elementFromPoint(x,y);
  while(el){
    if(el.id==='btnLeft'||el.id==='btnRight'||el.id==='btnRun'||el.id==='btnJump') return el.id;
    el=el.parentElement;
  }
  return null;
}
function setBtnVisual(id,on){
  var el=document.getElementById(id);
  if(!el) return;
  if(on) el.classList.add('pressed'); else el.classList.remove('pressed');
}
function releaseAllTouch(){
  activePointers={};
  applyButtonStates({});
}
function bindHold(id){ }
var btnDown={left:false,right:false,run:false,jump:false};
function applyButtonStates(want){
  keys.left  = !!want.btnLeft;
  keys.right = !!want.btnRight;
  keys.run   = !!want.btnRun;
  var jumpNow = !!want.btnJump;
  if(jumpNow && !btnDown.jump){
    jumpJustPressed=true;
    if(player) player.jumpBuf=JUMP_BUFFER;
  }
  jumpHeld = jumpNow;
  keys.jump = jumpNow;
  btnDown.jump = jumpNow;
  setBtnVisual('btnLeft',  keys.left);
  setBtnVisual('btnRight', keys.right);
  setBtnVisual('btnRun',   keys.run);
  setBtnVisual('btnJump',  jumpNow);
}
function recomputePressed(){
  // activePointers: identifier -> 按鍵id。彙整所有手指目前壓的鍵
  var want={};
  for(var pid in activePointers){
    var bid=activePointers[pid];
    if(bid) want[bid]=true;
  }
  applyButtonStates(want);
}

function setupInput(){
  // 每根手指用 identifier 獨立追蹤，互不干擾（跑跳同時按不會斷）
  function handleStart(e){
    if(state!=='play') return;
    var changed=false;
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      var id=btnIdAt(t.clientX,t.clientY);
      if(id){ activePointers[t.identifier]=id; changed=true; }
    }
    if(changed){ e.preventDefault(); recomputePressed(); }
  }
  function handleMove(e){
    if(state!=='play') return;
    var changed=false;
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(!(t.identifier in activePointers)) continue; // 只管原本就壓在鍵上的手指
      var id=btnIdAt(t.clientX,t.clientY);
      if(activePointers[t.identifier]!==id){
        activePointers[t.identifier]= id || null;
        changed=true;
      }
    }
    if(changed){ e.preventDefault(); recomputePressed(); }
  }
  function handleEnd(e){
    var changed=false;
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      if(t.identifier in activePointers){ delete activePointers[t.identifier]; changed=true; }
    }
    if(changed){ recomputePressed(); }
  }
  document.addEventListener('touchstart',handleStart,{passive:false});
  document.addEventListener('touchmove',handleMove,{passive:false});
  document.addEventListener('touchend',handleEnd,{passive:false});
  document.addEventListener('touchcancel',handleEnd,{passive:false});

  // 桌機滑鼠後備
  var mouseId=null;
  document.addEventListener('mousedown',function(e){
    if(state!=='play') return;
    var id=btnIdAt(e.clientX,e.clientY);
    if(id){ mouseId=id; activePointers['mouse']=id; recomputePressed(); }
  });
  document.addEventListener('mousemove',function(e){
    if(state!=='play'||mouseId===null) return;
    var id=btnIdAt(e.clientX,e.clientY);
    activePointers['mouse']=id; mouseId=id; recomputePressed();
  });
  document.addEventListener('mouseup',function(){ if(mouseId!==null){ delete activePointers['mouse']; mouseId=null; recomputePressed(); } });

  // 桌機滑鼠後備
  var mouseId=null;
  document.addEventListener('mousedown',function(e){
    if(state!=='play') return;
    var id=btnIdAt(e.clientX,e.clientY);
    if(id){ mouseId=id; activePointers['mouse']=id; recomputePressed(); }
  });
  document.addEventListener('mousemove',function(e){
    if(state!=='play'||!mouseId) return;
    var id=btnIdAt(e.clientX,e.clientY);
    activePointers['mouse']=id; mouseId=id; recomputePressed();
  });
  document.addEventListener('mouseup',function(){ if(mouseId!==null){ delete activePointers['mouse']; mouseId=null; recomputePressed(); } });

  // 失焦／切到背景時全部放開，避免卡鍵
  window.addEventListener('blur',releaseAllTouch);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) releaseAllTouch(); });

  // 鍵盤（桌機）
  window.addEventListener('keydown',function(e){
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Spacebar'].indexOf(e.key)>=0) e.preventDefault();
    if(e.repeat) return;
    var k=e.key.toLowerCase();
    if(k==='arrowleft'||k==='a') keys.left=true;
    if(k==='arrowright'||k==='d') keys.right=true;
    if(k==='shift') keys.run=true;
    if(k===' '||k==='arrowup'||k==='w'||k==='z'){ keys.jump=true; jumpHeld=true; jumpJustPressed=true; }
    if(k==='escape'||k==='p'){ togglePause(); }
  });
  window.addEventListener('keyup',function(e){
    var k=e.key.toLowerCase();
    if(k==='arrowleft'||k==='a') keys.left=false;
    if(k==='arrowright'||k==='d') keys.right=false;
    if(k==='shift') keys.run=false;
    if(k===' '||k==='arrowup'||k==='w'||k==='z'){ keys.jump=false; jumpHeld=false; }
  });

  // 防止整頁捲動
  document.addEventListener('touchmove',function(e){ if(state==='play') e.preventDefault(); },{passive:false});
}

function togglePause(){
  if(state==='play'){ state='pause'; show('pauseScreen'); hide('controls'); }
  else if(state==='pause'){ state='play'; hide('pauseScreen'); show('controls'); lastT=0; }
}

/* ========================= 按鈕綁定 ========================= */
function setupButtons(){
  document.getElementById('startBtn').onclick=function(){ audio(); gotoCharSelect(); };
  document.getElementById('charConfirm').onclick=function(){ gotoLevelSelect(); };
  document.getElementById('charBack').onclick=gotoMenu;
  document.getElementById('backToMenu').onclick=gotoCharSelect;
  document.getElementById('retryBtn').onclick=function(){ startLevel(levelIndex); };
  document.getElementById('nextBtn').onclick=function(){
    if(levelIndex+1<LEVELS.length) startLevel(levelIndex+1); else gotoLevelSelect();
  };
  document.getElementById('mapBtn').onclick=gotoLevelSelect;
  document.getElementById('pauseBtn').onclick=togglePause;
  document.getElementById('resumeBtn').onclick=togglePause;
  document.getElementById('quitBtn').onclick=function(){ hide('pauseScreen'); gotoLevelSelect(); };
}

/* ========================= 啟動 ========================= */
function init(){
  resize();
  setupInput();
  setupButtons();
  gotoMenu();
  requestAnimationFrame(loop);
}
if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',init);
else init();

})();

</script>
